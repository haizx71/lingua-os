services:
  - type: web
    name: lingua-api
    runtime: python
    buildCommand: python -m pip install -r requirements/backend.lock
    startCommand: python -m uvicorn --app-dir services/api/src lingua_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: REVIEW_CURSOR_SECRET
        sync: false
