name: K2 Hosted DB Reader Preflight

on:
  workflow_dispatch:

concurrency:
  group: k2-hosted-acceptance-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readonly-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'haizx71/lingua-os' &&
      github.ref == 'refs/heads/master' &&
      github.workflow_ref == 'haizx71/lingua-os/.github/workflows/k2-hosted-db-preflight.yml@refs/heads/master' &&
      github.actor == 'haizx71' &&
      github.triggering_actor == 'haizx71'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/backend-dev.lock
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/backend-dev.lock
      - name: Verify exact current master before reading staging secret
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api repos/haizx71/lingua-os/git/ref/heads/master --jq '.object.sha')" != "$GITHUB_SHA" ]; then
            echo 'K2 staging DB preflight is not at the current master tip.' >&2
            exit 1
          fi
      - name: Prove session pooler and read-only privileges without actors
        env:
          K2_STAGING_READONLY_DATABASE_URL: ${{ secrets.K2_STAGING_READONLY_DATABASE_URL }}
        run: python -m tests.acceptance.support.k2_readonly_privilege_probe
