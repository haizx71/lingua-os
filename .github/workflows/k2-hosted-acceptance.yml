name: K2 Hosted Acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run hosted acceptance, the actor janitor, or the fixture receipt reaper
        type: choice
        required: true
        default: acceptance
        options:
          - acceptance
          - janitor
          - fixture-reap
      wave:
        description: Select one fixed hosted acceptance wave or Reader pilot
        type: choice
        required: true
        default: K2-07
        options:
          - PILOT-READER
          - K2-07
          - K2-08-DUE-ONLY
          - K2-08
          - K2-09
          - K2-10
  schedule:
    - cron: '41 3 * * *'

concurrency:
  group: k2-hosted-acceptance-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hosted-acceptance:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'acceptance' &&
      (inputs.wave == 'PILOT-READER' || inputs.wave == 'K2-07' || inputs.wave == 'K2-08-DUE-ONLY' || inputs.wave == 'K2-08' || inputs.wave == 'K2-09' || inputs.wave == 'K2-10') &&
      github.repository == 'haizx71/lingua-os' &&
      github.ref == 'refs/heads/master' &&
      github.workflow_ref == 'haizx71/lingua-os/.github/workflows/k2-hosted-acceptance.yml@refs/heads/master' &&
      github.actor == 'haizx71' &&
      github.triggering_actor == 'haizx71'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/backend-dev.lock
      - name: Install locked dependencies without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/backend-dev.lock
      - name: Verify run SHA and selected wave before staging secrets
        env:
          GH_TOKEN: ${{ github.token }}
          K2_EXPECTED_WORKFLOW_REF: haizx71/lingua-os/.github/workflows/k2-hosted-acceptance.yml@refs/heads/master
          K2_REQUESTED_WAVE: ${{ inputs.wave }}
        run: |
          node --input-type=module <<'NODE'
          const expectedRepository = 'haizx71/lingua-os';
          if (process.env.GITHUB_REPOSITORY !== expectedRepository ||
              process.env.GITHUB_REF !== 'refs/heads/master' ||
              process.env.GITHUB_WORKFLOW_REF !== process.env.K2_EXPECTED_WORKFLOW_REF) {
            throw new Error('K2 hosted acceptance workflow identity is invalid.');
          }
          if (!['PILOT-READER', 'K2-07', 'K2-08-DUE-ONLY', 'K2-08', 'K2-09', 'K2-10'].includes(process.env.K2_REQUESTED_WAVE ?? '')) {
            throw new Error('K2 hosted acceptance wave selector is invalid.');
          }
          let response;
          try {
            response = await fetch(`https://api.github.com/repos/${expectedRepository}/git/ref/heads/master`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
            });
          } catch {
            throw new Error('K2 hosted acceptance could not verify the current master SHA.');
          }
          if (!response.ok) throw new Error('K2 hosted acceptance could not verify the current master SHA.');
          let ref;
          try { ref = await response.json(); }
          catch { throw new Error('K2 hosted acceptance current master response was invalid.'); }
          if (ref?.ref !== 'refs/heads/master' || ref?.object?.type !== 'commit' ||
              !/^[a-f0-9]{40}$/.test(ref?.object?.sha ?? '') ||
              ref.object.sha !== process.env.GITHUB_SHA) {
            throw new Error('K2 hosted acceptance dispatch SHA is not the current master tip.');
          }
          NODE
      - name: Install Chromium for the hosted browser flow
        run: pnpm exec playwright install --with-deps chromium
      - name: Run protected selected hosted subcase
        env:
          K2_ACCEPTANCE_MODE: acceptance
          K2_ACCEPTANCE_WAVE: ${{ inputs.wave }}
          PGSSLROOTCERT: ${{ github.workspace }}/database/certs/supabase-prod-ca-2021.crt
          K2_STAGING_API_ORIGIN: ${{ secrets.K2_STAGING_API_ORIGIN }}
          K2_STAGING_SUPABASE_URL: ${{ secrets.K2_STAGING_SUPABASE_URL }}
          K2_STAGING_SUPABASE_PROJECT_REF: ${{ secrets.K2_STAGING_SUPABASE_PROJECT_REF }}
          K2_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.K2_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          K2_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.K2_STAGING_SUPABASE_SECRET_KEY }}
          K2_STAGING_READONLY_DATABASE_URL: ${{ secrets.K2_STAGING_READONLY_DATABASE_URL }}
          K2_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$K2_ACCEPTANCE_WAVE" = "PILOT-READER" ]; then
            pnpm exec playwright test \
              --config=playwright.k2-hosted.config.ts \
              --workers=1 \
              --grep "pilot hosted Reader lifecycle" \
              tests/acceptance/pilot_reader_hosted_acceptance.spec.ts
          else
            pnpm exec playwright test \
              --config=playwright.k2-hosted.config.ts \
              --workers=1 \
              --grep "hosted lifecycle" \
              tests/acceptance/k2_hosted_acceptance.spec.ts
          fi

  janitor:
    if: >-
      github.repository == 'haizx71/lingua-os' &&
      github.ref == 'refs/heads/master' &&
      github.workflow_ref == 'haizx71/lingua-os/.github/workflows/k2-hosted-acceptance.yml@refs/heads/master' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'janitor' &&
        github.actor == 'haizx71' && github.triggering_actor == 'haizx71'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/backend-dev.lock
      - name: Install locked dependencies without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/backend-dev.lock
      - name: Verify dispatch SHA is still the master tip before staging secrets
        env:
          GH_TOKEN: ${{ github.token }}
          K2_EXPECTED_WORKFLOW_REF: haizx71/lingua-os/.github/workflows/k2-hosted-acceptance.yml@refs/heads/master
        run: |
          node --input-type=module <<'NODE'
          const expectedRepository = 'haizx71/lingua-os';
          if (process.env.GITHUB_REPOSITORY !== expectedRepository ||
              process.env.GITHUB_REF !== 'refs/heads/master' ||
              process.env.GITHUB_WORKFLOW_REF !== process.env.K2_EXPECTED_WORKFLOW_REF) {
            throw new Error('K2 hosted janitor workflow identity is invalid.');
          }
          let response;
          try {
            response = await fetch(`https://api.github.com/repos/${expectedRepository}/git/ref/heads/master`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
            });
          } catch {
            throw new Error('K2 hosted janitor could not verify the current master SHA.');
          }
          if (!response.ok) throw new Error('K2 hosted janitor could not verify the current master SHA.');
          let ref;
          try { ref = await response.json(); }
          catch { throw new Error('K2 hosted janitor current master response was invalid.'); }
          if (ref?.ref !== 'refs/heads/master' || ref?.object?.type !== 'commit' ||
              !/^[a-f0-9]{40}$/.test(ref?.object?.sha ?? '') ||
              ref.object.sha !== process.env.GITHUB_SHA) {
            throw new Error('K2 hosted janitor dispatch SHA is not the current master tip.');
          }
          NODE
      - name: Run guarded TTL janitor only
        env:
          K2_ACCEPTANCE_MODE: janitor
          PGSSLROOTCERT: ${{ github.workspace }}/database/certs/supabase-prod-ca-2021.crt
          K2_STAGING_SUPABASE_URL: ${{ secrets.K2_STAGING_SUPABASE_URL }}
          K2_STAGING_SUPABASE_PROJECT_REF: ${{ secrets.K2_STAGING_SUPABASE_PROJECT_REF }}
          K2_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.K2_STAGING_SUPABASE_SECRET_KEY }}
          K2_STAGING_READONLY_DATABASE_URL: ${{ secrets.K2_STAGING_READONLY_DATABASE_URL }}
          K2_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: >-
          pnpm exec playwright test
          --config=playwright.k2-hosted.config.ts
          --workers=1
          --grep "strict TTL janitor only reaps marked expired actors"
          tests/acceptance/k2_hosted_acceptance.spec.ts

  current-run-cleanup:
    if: >-
      always() &&
      needs.hosted-acceptance.result != 'skipped' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'acceptance' &&
      github.repository == 'haizx71/lingua-os' &&
      github.ref == 'refs/heads/master' &&
      github.workflow_ref == 'haizx71/lingua-os/.github/workflows/k2-hosted-acceptance.yml@refs/heads/master' &&
      github.actor == 'haizx71' &&
      github.triggering_actor == 'haizx71'
    needs: [hosted-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/backend-dev.lock
      - name: Install locked dependencies without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/backend-dev.lock
      - name: Recover only actors marked for this workflow run
        env:
          K2_ACCEPTANCE_MODE: cleanup-current
          K2_ACCEPTANCE_WAVE: ${{ inputs.wave }}
          PGSSLROOTCERT: ${{ github.workspace }}/database/certs/supabase-prod-ca-2021.crt
          K2_STAGING_SUPABASE_URL: ${{ secrets.K2_STAGING_SUPABASE_URL }}
          K2_STAGING_SUPABASE_PROJECT_REF: ${{ secrets.K2_STAGING_SUPABASE_PROJECT_REF }}
          K2_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.K2_STAGING_SUPABASE_SECRET_KEY }}
          K2_STAGING_READONLY_DATABASE_URL: ${{ secrets.K2_STAGING_READONLY_DATABASE_URL }}
          K2_GITHUB_TOKEN: ${{ inputs.wave == 'K2-09' && github.token || '' }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: >-
          pnpm exec playwright test
          --config=playwright.k2-hosted.config.ts
          --workers=1
          --grep "unconditional current-run cleanup recovery"
          tests/acceptance/k2_hosted_acceptance.spec.ts

  fixture-reaper:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'fixture-reap' &&
      github.repository == 'haizx71/lingua-os' &&
      github.ref == 'refs/heads/master' &&
      github.workflow_ref == 'haizx71/lingua-os/.github/workflows/k2-hosted-acceptance.yml@refs/heads/master' &&
      github.actor == 'haizx71' &&
      github.triggering_actor == 'haizx71'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify dispatch SHA is still the master tip before fixture reaping
        env:
          GH_TOKEN: ${{ github.token }}
          K2_EXPECTED_WORKFLOW_REF: haizx71/lingua-os/.github/workflows/k2-hosted-acceptance.yml@refs/heads/master
        run: |
          node --input-type=module <<'NODE'
          const expectedRepository = 'haizx71/lingua-os';
          if (process.env.GITHUB_REPOSITORY !== expectedRepository ||
              process.env.GITHUB_REF !== 'refs/heads/master' ||
              process.env.GITHUB_WORKFLOW_REF !== process.env.K2_EXPECTED_WORKFLOW_REF) {
            throw new Error('K2 hosted fixture reaper workflow identity is invalid.');
          }
          let response;
          try {
            response = await fetch(`https://api.github.com/repos/${expectedRepository}/git/ref/heads/master`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
            });
          } catch {
            throw new Error('K2 hosted fixture reaper could not verify the current master SHA.');
          }
          if (!response.ok) throw new Error('K2 hosted fixture reaper could not verify the current master SHA.');
          let ref;
          try { ref = await response.json(); }
          catch { throw new Error('K2 hosted fixture reaper current master response was invalid.'); }
          if (ref?.ref !== 'refs/heads/master' || ref?.object?.type !== 'commit' ||
              !/^[a-f0-9]{40}$/.test(ref?.object?.sha ?? '') ||
              ref.object.sha !== process.env.GITHUB_SHA) {
            throw new Error('K2 hosted fixture reaper dispatch SHA is not the current master tip.');
          }
          NODE
      - name: Run guarded TTL fixture reaper only
        env:
          K2_ACCEPTANCE_MODE: fixture-reap
          K2_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: >-
          pnpm exec playwright test
          --config=playwright.k2-hosted.config.ts
          --workers=1
          --grep "fixture reaper only closes expired completed run receipts"
          tests/acceptance/k2_hosted_acceptance.spec.ts
