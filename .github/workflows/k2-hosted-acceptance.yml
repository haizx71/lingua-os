name: K2 Hosted Acceptance

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      mode:
        description: Run K2-07 acceptance or the guarded TTL-only janitor
        type: choice
        required: true
        default: acceptance
        options:
          - acceptance
          - janitor
  schedule:
    - cron: '41 3 * * *'

concurrency:
  group: k2-hosted-acceptance-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security-gate:
    if: github.repository == 'haizx71/lingua-os' && ((github.event_name == 'pull_request' && github.base_ref == 'master') || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium for the local redirect security test
        run: pnpm exec playwright install --with-deps chromium
      - name: Run real-browser OIDC redirect security gate
        run: >-
          pnpm exec playwright test
          --config=playwright.k2-hosted.config.ts
          --workers=1
          --grep "real cross-origin redirect"
          tests/acceptance/k2_playwright_network.spec.ts
      - name: Run hosted-harness unit and type checks
        run: >-
          pnpm exec vitest run
          tests/acceptance/support/k2_hosted_acceptance_helpers.test.ts
          tests/acceptance/support/k2_hosted_actors.test.ts
          tests/acceptance/support/k2_hosted_probe_client.test.ts
          tests/acceptance/support/k2_hosted_wave_k2_07.test.ts
          tests/acceptance/support/k2_playwright_network.test.ts
          --maxWorkers=1
      - name: Typecheck workspace contracts and packages
        run: pnpm typecheck

  hosted-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'acceptance' && github.repository == 'haizx71/lingua-os' && github.ref == 'refs/heads/master'
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: k2-staging
    permissions:
      contents: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/backend-dev.lock
      - name: Install locked dependencies without JavaScript lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/backend-dev.lock
      - name: Install Chromium for the hosted browser flow
        run: pnpm exec playwright install --with-deps chromium
      - name: Run protected K2-07 acceptance
        env:
          K2_ACCEPTANCE_MODE: acceptance
          K2_STAGING_API_ORIGIN: ${{ secrets.K2_STAGING_API_ORIGIN }}
          K2_STAGING_SUPABASE_URL: ${{ secrets.K2_STAGING_SUPABASE_URL }}
          K2_STAGING_SUPABASE_PROJECT_REF: ${{ secrets.K2_STAGING_SUPABASE_PROJECT_REF }}
          K2_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.K2_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          K2_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.K2_STAGING_SUPABASE_SECRET_KEY }}
          K2_STAGING_READONLY_DATABASE_URL: ${{ secrets.K2_STAGING_READONLY_DATABASE_URL }}
          K2_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          pnpm exec playwright test
          --config=playwright.k2-hosted.config.ts
          --workers=1
          --grep "hosted lifecycle delegates K2-07 fixture assertions"
          tests/acceptance/k2_hosted_acceptance.spec.ts

  janitor:
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'janitor')) && github.repository == 'haizx71/lingua-os' && github.ref == 'refs/heads/master'
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: k2-staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/backend-dev.lock
      - name: Install locked dependencies without JavaScript lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/backend-dev.lock
      - name: Run guarded TTL janitor only
        env:
          K2_ACCEPTANCE_MODE: janitor
          K2_STAGING_SUPABASE_URL: ${{ secrets.K2_STAGING_SUPABASE_URL }}
          K2_STAGING_SUPABASE_PROJECT_REF: ${{ secrets.K2_STAGING_SUPABASE_PROJECT_REF }}
          K2_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.K2_STAGING_SUPABASE_SECRET_KEY }}
          K2_STAGING_READONLY_DATABASE_URL: ${{ secrets.K2_STAGING_READONLY_DATABASE_URL }}
        run: >-
          pnpm exec playwright test
          --config=playwright.k2-hosted.config.ts
          --workers=1
          --grep "strict TTL janitor only reaps marked expired actors"
          tests/acceptance/k2_hosted_acceptance.spec.ts

  current-run-cleanup:
    if: always() && needs.security-gate.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.mode == 'acceptance' && github.repository == 'haizx71/lingua-os' && github.ref == 'refs/heads/master'
    needs: [security-gate, hosted-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: k2-staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/backend-dev.lock
      - name: Install locked dependencies without JavaScript lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/backend-dev.lock
      - name: Recover only actors marked for this workflow run
        env:
          K2_ACCEPTANCE_MODE: cleanup-current
          K2_STAGING_SUPABASE_URL: ${{ secrets.K2_STAGING_SUPABASE_URL }}
          K2_STAGING_SUPABASE_PROJECT_REF: ${{ secrets.K2_STAGING_SUPABASE_PROJECT_REF }}
          K2_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.K2_STAGING_SUPABASE_SECRET_KEY }}
          K2_STAGING_READONLY_DATABASE_URL: ${{ secrets.K2_STAGING_READONLY_DATABASE_URL }}
        run: >-
          pnpm exec playwright test
          --config=playwright.k2-hosted.config.ts
          --workers=1
          --grep "unconditional current-run cleanup recovery"
          tests/acceptance/k2_hosted_acceptance.spec.ts
