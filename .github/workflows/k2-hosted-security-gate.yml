name: K2 Hosted Harness Security Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/backend-dev.lock
      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install locked Python dependencies from wheels only
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          -r requirements/backend-dev.lock
      - name: Install Chromium for the local redirect security test
        run: pnpm exec playwright install --with-deps chromium
      - name: Run real-browser OIDC redirect security gate
        run: >-
          pnpm exec playwright test
          --config=playwright.k2-hosted.config.ts
          --workers=1
          --grep "real cross-origin redirect"
          tests/acceptance/k2_playwright_network.spec.ts
      - name: Run hosted-harness unit and workflow security checks
        run: >-
          pnpm exec vitest run
          tests/acceptance/support/k2_hosted_acceptance_helpers.test.ts
          tests/acceptance/support/k2_hosted_actors.test.ts
          tests/acceptance/support/k2_hosted_runner.test.ts
          tests/acceptance/support/k2_hosted_probe_client.test.ts
          tests/acceptance/support/k2_hosted_wave_k2_07.test.ts
          tests/acceptance/support/k2_hosted_wave_k2_08_due_only.test.ts
          tests/acceptance/support/k2_playwright_network.test.ts
          tests/acceptance/support/k2_hosted_workflow_security.test.ts
          tests/frontend/k2-vercel-attestation.test.ts
          --maxWorkers=1
      - name: Typecheck workspace contracts and packages
        run: pnpm typecheck
      - name: Run read-only hosted probe tests
        run: python -m pytest -q tests/acceptance/support/test_k2_hosted_probe.py
