name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_PASSWORD: lingua_test_password
          POSTGRES_DB: lingua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingua_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://postgres:lingua_test_password@127.0.0.1:5432/lingua_test
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/backend-dev.lock

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/backend-dev.lock

      - name: Contract generation freshness
        run: pnpm contracts:check-generated

      - name: Backend format
        run: pnpm backend:format:check

      - name: Backend lint
        run: pnpm backend:lint

      - name: Backend typecheck
        run: pnpm backend:typecheck

      - name: Backend tests
        run: pnpm backend:test

      - name: Frontend typecheck
        run: pnpm -r typecheck

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Storybook build
        run: pnpm build-storybook

      - name: Production build
        run: pnpm build

      - name: Reject whitespace errors
        run: git diff --check HEAD^
