[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = [".", "services/api/src"]
testpaths = ["tests/backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps", "packages/ui", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/api/src"
files = ["services/api/src", "database/migrate.py", "tests/backend"]
