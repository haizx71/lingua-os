      type: object
      additionalProperties: false
      required: [languageProfileId, statusCounts, dueCount, memoryHealth, competence, startingLevelEstimate, recentConcepts, calculatedAt]
      properties:
        languageProfileId: { type: string, format: uuid }
        statusCounts: { $ref: '#/components/schemas/ConceptStatusCounts' }
        dueCount: { type: integer, minimum: 0 }
        memoryHealth:
          description: >-
            Null until a separate authoritative, versioned Memory Health projection is approved;
            Brain does not derive or default this metric.
          oneOf:
            - { type: number, minimum: 0, maximum: 1 }
            - { type: 'null' }
        competence: { $ref: '#/components/schemas/CompetenceSignals' }
        startingLevelEstimate:
          oneOf:
            - $ref: '#/components/schemas/StartingLevelEstimate'
            - type: 'null'
        recentConcepts:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/BrainConceptSummary' }
        calculatedAt: { type: string, format: date-time }
    EvidenceSummary:
      type: object
      additionalProperties: false
      required: [exposureCount, reviewCount]
      properties:
        exposureCount: { type: integer, minimum: 0 }
        reviewCount: { type: integer, minimum: 0 }
        lastSeenAt: { type: string, format: date-time }
        lastReviewedAt: { type: string, format: date-time }
    BrainConceptDetail:
      type: object
      additionalProperties: false
      required: [concept, status, competence, mastery, confidence, memory, evidence]
      properties:
        concept: { $ref: '#/components/schemas/ConceptDetail' }
        status: { $ref: '#/components/schemas/ConceptStatus' }
        competence: { $ref: '#/components/schemas/CompetenceSignals' }
        mastery:
          description: >-
            Authoritative nullable TASK-006D aggregate. Null means the required mastery-eligible
            dimensions do not yet have sufficient evidence; it is never replaced by a fallback.
          oneOf:
            - { type: number, minimum: 0, maximum: 1 }
            - { type: 'null' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        memory:
          oneOf:
            - $ref: '#/components/schemas/MemorySnapshot'
            - type: 'null'
        evidence: { $ref: '#/components/schemas/EvidenceSummary' }
    BrainSummaryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/BrainSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    BrainConceptListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BrainConceptSummary' }
        meta: { $ref: '#/components/schemas/CursorResponseMeta' }
    BrainConceptResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/BrainConceptDetail' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ProgressDay:
      type: object
      additionalProperties: false
      required: [date, minutes, activitiesCompleted, goalMet, conceptsExposed, conceptsStrengthened]
      properties:
        date: { type: string, format: date }
        minutes: { type: integer, minimum: 0, maximum: 1440 }
        activitiesCompleted: { type: integer, minimum: 0 }
        goalMet: { type: boolean }
        conceptsExposed: { type: integer, minimum: 0 }
        conceptsStrengthened: { type: integer, minimum: 0 }
    RetentionPoint:
      type: object
      additionalProperties: false
      required: [date, successfulReviewRatio, reviewedCount]
      properties:
        date: { type: string, format: date }
        successfulReviewRatio: { type: number, minimum: 0, maximum: 1 }
        reviewedCount: { type: integer, minimum: 0 }
    ProgressOverview:
      type: object
      additionalProperties: false
      required: [languageProfileId, windowStart, windowEnd, startingLevelEstimate, memoryHealth, competence, successfulLearningDays, targetLearningDays, conceptsExposed, conceptsStrengthened, totalMinutes, dailyActivity, retentionTrend, calculatedAt]
      properties:
        languageProfileId: { type: string, format: uuid }
        windowStart: { type: string, format: date }
        windowEnd: { type: string, format: date }
        startingLevelEstimate:
          oneOf:
            - $ref: '#/components/schemas/StartingLevelEstimate'
            - type: 'null'
        memoryHealth: { type: number, minimum: 0, maximum: 1 }
        competence: { $ref: '#/components/schemas/CompetenceSignals' }
        successfulLearningDays: { type: integer, minimum: 0, maximum: 31 }
        targetLearningDays: { type: integer, minimum: 0, maximum: 31 }
        conceptsExposed: { type: integer, minimum: 0 }
        conceptsStrengthened: { type: integer, minimum: 0 }
        totalMinutes: { type: integer, minimum: 0 }
        dailyActivity:
          type: array
          maxItems: 31
          items: { $ref: '#/components/schemas/ProgressDay' }
        retentionTrend:
          type: array
          maxItems: 31
          items: { $ref: '#/components/schemas/RetentionPoint' }
        calculatedAt: { type: string, format: date-time }
    ProgressOverviewResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ProgressOverview' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
