          in: query
          schema:
            $ref: '#/components/schemas/LibraryItemType'
        - name: query
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated owned library items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryItemsResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/library/concepts/{conceptId}:
    parameters:
      - $ref: '#/components/parameters/ConceptId'
    put:
      tags: [Library]
      operationId: saveConceptToLibrary
      summary: Idempotently save a concept
