          maxItems: 4
          items: { $ref: '#/components/schemas/AssessmentOption' }
        allowSkip: { type: boolean }
      allOf:
        - if:
            properties:
              domain: { const: listening_comprehension }
            required: [domain]
          then:
            required: [audioUrl]
            properties:
              audioUrl: { type: string, format: uri }
