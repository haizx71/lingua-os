        '500': { $ref: '#/components/responses/InternalError' }

  /v1/assessments:
    post:
      tags: [Assessment]
      operationId: startStartingLevelAssessment
      summary: Start or resume a bounded Starting Level Estimate
      description: >-
        Starts one new attempt in the in-progress state for an authenticated actor's owned, active vi-to-en
        Language Profile (201), or returns the actor's existing in-progress or completed session
        with no retake (200). At most one in_progress attempt may exist per learner and
        Language Profile. An exact replay using the same Idempotency-Key returns the original
        status and data snapshot; reuse of the key for a different logical command returns 409
        IDEMPOTENCY_KEY_REUSED. A missing or non-owned Language Profile uses the same 404 response.
        Paused or archived profiles reject mutation. Starting Level is optional, and failure to
        start because the frozen question/audio bank is unavailable returns 503 rather than
        silently changing the policy template.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAssessmentRequest'
      responses:
        '200':
          description: Existing in-progress session resumed, or existing completed session returned; no retake is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSessionResponse'
        '201':
          description: New Starting Level Estimate attempt created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSessionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/assessments/{assessmentId}:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [Assessment]
      operationId: getStartingLevelAssessment
      summary: Resume owned assessment state or retrieve its estimate
      description: >-
        Read-only retrieval of an owned in-progress, completed, or abandoned assessment. It never
        advances an attempt or creates learner state. A missing assessment and an assessment not
        owned by the authenticated actor use the same 404 response. Historical assessment state
        remains readable after the Language Profile is paused or archived.
      responses:
        '200':
          description: Current session and optional completed estimate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSessionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/assessments/{assessmentId}/responses:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    post:
      tags: [Assessment]
      operationId: submitStartingLevelResponse
      summary: Submit one answer or deliberate skip
      description: >-
        Submits exactly one immutable response for the persisted current item. The request contains
        either a selected option or skipped=true, never both; the server resolves correctness and
        remains the sole authority for level and confidence. An exact Idempotency-Key replay
        returns the original data snapshot without advancing twice. Reuse of a key for another
        logical command returns 409 IDEMPOTENCY_KEY_REUSED. Answering a stale item, a completed or
        abandoned attempt, or an attempt whose Language Profile is paused or archived returns 409
        INVALID_STATE_TRANSITION. Missing and non-owned assessment IDs use the same 404 semantics.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAssessmentResponseRequest'
      responses:
        '200':
          description: Next assessment state or completed evidence-based estimate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSessionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/brain/summary:
    get:
      tags: [Brain]
      operationId: getBrainSummary
      summary: Get a bounded Language Brain summary
      description: >-
        Read-only relational projection for the authenticated learner. This GET does not mutate
        learner state. When languageProfileId is supplied, a missing profile and a profile not
        owned by the authenticated actor use the same 404 resource-not-found response.
      parameters:
        - $ref: '#/components/parameters/LanguageProfileIdQuery'
      responses:
        '200':
          description: Counts, memory health, competence signals, and recent concepts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainSummaryResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/brain/concepts:
    get:
      tags: [Brain]
      operationId: listBrainConcepts
      summary: List learner concepts for the MVP Brain list
      description: >-
        Read-only relational projection for list/filter UX, not a graph database or graph
        visualization API. This GET does not mutate learner state. The default collection is
        learner-anchored and never expands to the full catalog. Pagination uses an opaque,
        server-controlled keyset cursor with deterministic canonical key then concept ID order;
        the cursor does not expose raw internal state. When languageProfileId is supplied, a
        missing profile and a profile not owned by the authenticated actor use the same 404
        resource-not-found response.
      parameters:
        - $ref: '#/components/parameters/LanguageProfileIdQuery'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ConceptStatus'
        - name: query
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated learner concept projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainConceptListResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/brain/concepts/{conceptId}:
    parameters:
      - $ref: '#/components/parameters/ConceptId'
    get:
      tags: [Brain]
      operationId: getBrainConcept
      summary: Get one concept's memory, competence, and evidence projection
      description: >-
        Read-only bounded detail projection for the authenticated learner's active English
        profile. This GET does not mutate learner state, including when it returns a synthetic
        zero-evidence learner projection for an authorized catalog concept. Missing concepts and
        unavailable owned-profile context use the 404 resource-not-found response without leaking
        ownership existence.
      responses:
        '200':
          description: Language Brain concept detail with a single memory snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainConceptResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/progress/overview:
    get:
      tags: [Progress]
      operationId: getProgressOverview
      summary: Get evidence-based progress without XP-first metrics
      parameters:
        - $ref: '#/components/parameters/LanguageProfileIdQuery'
        - name: window
          in: query
          schema:
            type: string
            enum: [week, month]
            default: week
      responses:
        '200':
          description: Bounded trends, weekly learning outcomes, memory health, and competence projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressOverviewResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token. FastAPI validates `sub` and derives ownership server-side.

  headers:
    ETag:
      description: Opaque strong resource version used by If-Match.
      schema:
        type: string
        pattern: '^"[^"\\r\\n]+"$'
    PrivateNoStore:
      description: Actor-specific authenticated representation must not be stored by any cache.
      schema:
        type: string
        const: private, no-store

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page. Clients must not parse it.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unique to one logical mutation and payload.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest representation; stale edits fail with 412.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    LanguageProfileId:
      name: languageProfileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LanguageProfileIdQuery:
      name: languageProfileId
      in: query
      description: Owned profile. Defaults to the active English profile in MVP.
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewItemId:
      name: reviewItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConceptId:
      name: conceptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContentId:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SentenceId:
      name: sentenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: Missing, expired, or invalid bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated actor is not allowed to access the resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource does not exist or is not visible to the actor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Resource state or unique business key conflicts with the request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InvalidStateTransition:
      description: The requested lifecycle transition is not allowed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PreconditionFailed:
      description: If-Match is missing or stale for this representation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Request syntax or domain validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Request rate exceeded; Retry-After may be supplied.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: A required bounded service is temporarily unavailable.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Unexpected server failure with no sensitive implementation detail.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ErrorCode:
      type: string
      enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, PRECONDITION_FAILED, CONFLICT, INVALID_STATE_TRANSITION, IDEMPOTENCY_KEY_REUSED, VALIDATION_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              minLength: 1
              maxLength: 500
            requestId: { type: string, format: uuid }
            details:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ValidationIssue'
            retryAfterSeconds:
              type: integer
              minimum: 1
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 300 }
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId, apiVersion]
      properties:
        requestId: { type: string, format: uuid }
        apiVersion: { type: string, const: '1.0' }
    CursorResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId, apiVersion, nextCursor, hasMore, pageSize]
      properties:
        requestId: { type: string, format: uuid }
        apiVersion: { type: string, const: '1.0' }
        nextCursor:
          type: [string, 'null']
          maxLength: 512
        hasMore: { type: boolean }
        pageSize: { type: integer, minimum: 0, maximum: 100 }
    LanguageCode:
      type: string
      pattern: '^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$'
      examples: [en, vi]
    ConceptStatus:
      type: string
      x-enum-registry: concept_status
      enum: [unseen, discovered, learning, familiar, active, mastered, weak, forgotten]
    LearningActivityType:
      type: string
      x-enum-registry: learning_activity_type
      enum: [review, read, listen, learn]
    ReviewRating:
      type: string
      x-enum-registry: review_rating
      enum: [again, hard, good, easy]
    ReviewExerciseMode:
      type: string
      x-enum-registry: review_exercise_mode
      description: Presentation/evidence variant sharing the concept's single memory schedule.
      enum: [self_recall, multiple_choice, typing, cloze, listening]
    MemoryState:
      type: string
      x-enum-registry: memory_state
      enum: [new, learning, review, relearning]
    CompetenceDimension:
      type: string
      x-enum-registry: competence_dimension
      enum: [recognition, listening, production]
    LearningGoal:
      type: string
      x-enum-registry: learning_goal
      enum: [communication, work, travel, basics, academic]
    LanguageProfileStatus:
      type: string
      x-enum-registry: language_profile_status
      enum: [active, paused, archived]
    ConfidenceBand:
      type: string
      x-enum-registry: confidence_band
      enum: [low, medium, high]
    AssessmentStatus:
      type: string
      x-enum-registry: assessment_status
      enum: [in_progress, completed, abandoned]
    AssessmentDomain:
      type: string
      x-enum-registry: assessment_domain
      description: Objective Starting Level question domain; no speaking, pronunciation, or free-production inference.
      enum: [vocabulary_recognition, grammar_in_context, reading_comprehension, listening_comprehension]
    StartingLevelBandCode:
      type: string
      x-enum-registry: starting_level_band
      description: Bounded Starting Level output. A0 is LINGUA's project-defined pre-A1 starting band, not an official CEFR level.
      enum: [A0, A1, A2, B1]
    TodayPlanStatus:
      type: string
      x-enum-registry: today_plan_status
      enum: [draft, active, completed, expired]
    TodayActivityStatus:
      type: string
      x-enum-registry: today_activity_status
      enum: [pending, completed, skipped]
    TodayReasonCode:
      type: string
      x-enum-registry: today_reason_code
      enum: [FSRS_DUE, FORGOTTEN_REMEDIATION, WEAK_REMEDIATION, WEAK_RECOGNITION, WEAK_LISTENING, LOW_PRODUCTION_EVIDENCE, CONTENT_FIT, RECENT_EXPOSURE, NEW_CONCEPT_BUDGET]
    ContentType:
      type: string
      x-enum-registry: content_type
      enum: [article, story, dialogue, lesson, transcript]
    AdminContentStatus:
      type: string
      x-enum-registry: admin_content_status
      enum: [raw, normalized, enriched, reviewed, published, quarantined, retired]
    ReaderExposureType:
      type: string
      x-enum-registry: reader_exposure_type
      enum: [read, listen, lookup]
    ReaderContentLevel:
      type: string
      x-enum-registry: reader_content_level
      description: Curator-selected Reader fit label; it is not a formal CEFR certification.
      enum: [A0, A1, A2, B1]
    ContentSegmentType:
      type: string
      x-enum-registry: content_segment_type
      enum: [sentence, paragraph, dialogue_turn, caption]
    LibraryItemType:
      type: string
      x-enum-registry: library_item_type
      enum: [content, sentence, concept]
    PartOfSpeech:
      type: string
      description: Source-normalized lexical category for concepts that have a lexeme; no placeholder value is used for non-lexical concepts.
      minLength: 1
      maxLength: 64
    ProficiencyLevel:
      type: object
      additionalProperties: false
      required: [frameworkCode, code, label]
      properties:
        frameworkCode: { type: string, minLength: 1, maxLength: 32, example: CEFR }
        code: { type: string, minLength: 1, maxLength: 16, example: A2 }
        label: { type: string, minLength: 1, maxLength: 100, example: Elementary }
    StartingLevelBand:
      type: object
      additionalProperties: false
      description: >-
        A bounded content-starting reference. CEFR is used only as a reference vocabulary; this is
        not a standardized certificate. A0 is the LINGUA-defined pre-A1 starting band.
      required: [frameworkCode, code, label]
      properties:
        frameworkCode: { type: string, const: CEFR }
        code: { $ref: '#/components/schemas/StartingLevelBandCode' }
        label: { type: string, minLength: 1, maxLength: 100, example: Elementary }
    StartingLevelEstimate:
      type: object
      additionalProperties: false
      description: Evidence-based starting estimate for adaptation, not a standardized level certificate.
      required: [level, confidence, confidenceBand, assessedSkills, evidenceCount, methodVersion, estimatedAt]
      properties:
        level: { $ref: '#/components/schemas/StartingLevelBand' }
        confidence:
          type: number
          minimum: 0
          maximum: 0.85
          multipleOf: 0.01
          description: Reliability of this bounded estimate, not percent correct; rounded to two decimal places.
          example: 0.79
        confidenceBand: { $ref: '#/components/schemas/ConfidenceBand' }
        assessedSkills:
          type: array
          minItems: 1
          uniqueItems: true
          description: Competence dimensions actually represented by non-skipped responses; v1 never infers production.
          items:
            type: string
            enum: [recognition, listening]
        evidenceCount: { type: integer, minimum: 6, maximum: 16 }
        methodVersion: { type: string, const: starting-level-heuristic-v1 }
        estimatedAt: { type: string, format: date-time, example: '2026-08-22T03:00:00Z' }
    MeProfile:
      type: object
      additionalProperties: false
      required: [id, email, displayName, interfaceLanguageCode, timeZone, languageProfiles, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'], format: email, maxLength: 320, readOnly: true }
        displayName: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        interfaceLanguageCode: { $ref: '#/components/schemas/LanguageCode' }
        timeZone: { type: [string, 'null'], minLength: 1, maxLength: 64, example: Asia/Ho_Chi_Minh }
        languageProfiles:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LanguageProfile' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        interfaceLanguageCode: { $ref: '#/components/schemas/LanguageCode' }
        timeZone: { type: string, minLength: 1, maxLength: 64, example: Asia/Ho_Chi_Minh }
    LanguageProfile:
      type: object
      additionalProperties: false
      required: [id, etag, targetLanguageCode, nativeLanguageCode, goal, dailyMinutes, targetLevel, startingLevelEstimate, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        etag:
          type: string
          minLength: 1
          readOnly: true
          description: >-
            Opaque strong concurrency token for this language-profile resource, suitable for
            If-Match on child mutations. Pass it unchanged; it is not the parent /v1/me ETag or
            a collection response ETag. Create replay retains the original child token.
        targetLanguageCode: { $ref: '#/components/schemas/LanguageCode' }
        nativeLanguageCode: { $ref: '#/components/schemas/LanguageCode' }
        goal: { $ref: '#/components/schemas/LearningGoal' }
        dailyMinutes: { type: integer, minimum: 5, maximum: 180 }
        targetLevel:
          oneOf:
            - $ref: '#/components/schemas/ProficiencyLevel'
            - type: 'null'
        startingLevelEstimate:
          oneOf:
            - $ref: '#/components/schemas/StartingLevelEstimate'
            - type: 'null'
        status: { $ref: '#/components/schemas/LanguageProfileStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateLanguageProfileRequest:
      type: object
      additionalProperties: false
      required: [targetLanguageCode, nativeLanguageCode, goal, dailyMinutes]
      properties:
        targetLanguageCode:
          allOf:
            - $ref: '#/components/schemas/LanguageCode'
            - type: string
              const: en
        nativeLanguageCode:
          allOf:
            - $ref: '#/components/schemas/LanguageCode'
            - type: string
              const: vi
        goal: { $ref: '#/components/schemas/LearningGoal' }
        dailyMinutes: { type: integer, minimum: 5, maximum: 180 }
        selfEstimatedLevelCode: { type: string, minLength: 1, maxLength: 16, example: A1 }
        targetLevelCode: { type: string, minLength: 1, maxLength: 16, example: B1 }
    UpdateLanguageProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        goal: { $ref: '#/components/schemas/LearningGoal' }
        dailyMinutes: { type: integer, minimum: 5, maximum: 180 }
        targetLevelCode: { type: [string, 'null'], minLength: 1, maxLength: 16 }
        status: { $ref: '#/components/schemas/LanguageProfileStatus' }
    MeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/MeProfile' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    LanguageProfilesResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LanguageProfile' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    LanguageProfileResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/LanguageProfile' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    TodayPlan:
      type: object
      additionalProperties: false
      required: [id, languageProfileId, planDate, timeZone, targetMinutes, completedMinutes, status, engineVersion, activities, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        languageProfileId: { type: string, format: uuid }
        planDate: { type: string, format: date }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        targetMinutes: { type: integer, minimum: 5, maximum: 180 }
        completedMinutes: { type: integer, minimum: 0, maximum: 1440 }
        status: { $ref: '#/components/schemas/TodayPlanStatus' }
        engineVersion: { type: string, minLength: 1, maxLength: 64 }
        activities:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TodayActivity' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TodayActivity:
      type: object
      additionalProperties: false
      required: [id, position, activityType, title, description, estimatedMinutes, reasonCodes, reasonText, status, completedCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        activityType: { $ref: '#/components/schemas/LearningActivityType' }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 500 }
        estimatedMinutes: { type: integer, minimum: 0, maximum: 240 }
        reasonCodes:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { $ref: '#/components/schemas/TodayReasonCode' }
        reasonText: { type: string, minLength: 1, maxLength: 300 }
        status: { $ref: '#/components/schemas/TodayActivityStatus' }
        targetCount: { type: integer, minimum: 0 }
        completedCount: { type: integer, minimum: 0 }
        contentId: { type: string, format: uuid }
        conceptId: { type: string, format: uuid }
        reviewItemId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CompleteTodayActivityRequest:
      type: object
      additionalProperties: false
      properties:
        durationSeconds: { type: integer, minimum: 0, maximum: 86400 }
    TodayCompletion:
      type: object
      additionalProperties: false
      required: [plan, activity]
      properties:
        plan: { $ref: '#/components/schemas/TodayPlan' }
        activity: { $ref: '#/components/schemas/TodayActivity' }
    TodayPlanResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TodayPlan' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    TodayCompletionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TodayCompletion' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CompetenceScore:
      type: object
      additionalProperties: false
      required: [score, confidence, evidenceCount]
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidenceCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    CompetenceSignals:
      type: object
      additionalProperties: false
      required: [recognition, listening, production]
      properties:
        recognition: { $ref: '#/components/schemas/CompetenceScore' }
        listening: { $ref: '#/components/schemas/CompetenceScore' }
        production: { $ref: '#/components/schemas/CompetenceScore' }
    MemorySnapshot:
      type: object
      additionalProperties: false
      description: Public projection of the concept's one primary memory lineage; FSRS parameters are private.
      required: [state, dueAt, isDue]
      properties:
        state: { $ref: '#/components/schemas/MemoryState' }
        dueAt: { type: string, format: date-time }
        lastReviewedAt: { type: string, format: date-time }
        isDue: { type: boolean }
    ConceptSummary:
      type: object
      additionalProperties: false
      required: [id, canonicalForm, status, isDue]
      properties:
        id: { type: string, format: uuid }
        canonicalForm: { type: string, minLength: 1, maxLength: 300 }
        partOfSpeech:
          oneOf:
            - $ref: '#/components/schemas/PartOfSpeech'
            - type: 'null'
        ipa: { type: string, maxLength: 200 }
        audioUrl: { type: string, format: uri }
        level:
          oneOf:
            - $ref: '#/components/schemas/ProficiencyLevel'
            - type: 'null'
        status: { $ref: '#/components/schemas/ConceptStatus' }
        isDue: { type: boolean }
    ReviewPrompt:
      type: object
      additionalProperties: false
      required: [promptText]
      properties:
        promptText: { type: string, minLength: 1, maxLength: 2000 }
        contextSentence: { type: string, maxLength: 3000 }
        translation: { type: string, maxLength: 3000 }
        audioUrl: { type: string, format: uri }
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [id, text]
            properties:
              id: { type: string, format: uuid }
              text: { type: string, minLength: 1, maxLength: 500 }
    ReviewQueueItem:
      type: object
      additionalProperties: false
      required: [reviewItemId, concept, exerciseMode, prompt, memory, competence]
      properties:
        reviewItemId: { type: string, format: uuid }
        concept: { $ref: '#/components/schemas/ConceptSummary' }
        exerciseMode: { $ref: '#/components/schemas/ReviewExerciseMode' }
        prompt: { $ref: '#/components/schemas/ReviewPrompt' }
        memory: { $ref: '#/components/schemas/MemorySnapshot' }
        competence: { $ref: '#/components/schemas/CompetenceSignals' }
    ReviewAnswerRequest:
      type: object
      additionalProperties: false
      required: [rating, responseTimeMs]
      properties:
        rating: { $ref: '#/components/schemas/ReviewRating' }
        exerciseMode: { $ref: '#/components/schemas/ReviewExerciseMode' }
        correct:
          type: boolean
          description: >-
            Caller-reported correctness is accepted only for self_recall (including the legacy
            request that omits exerciseMode). The server does not grade other modes.
        responseText: { type: string, maxLength: 5000 }
        selectedOptionId: { type: string, format: uuid }
        responseTimeMs: { type: integer, minimum: 0, maximum: 3600000 }
    ReviewAnswerResult:
      type: object
      additionalProperties: false
      required: [reviewItemId, memory, competence, remainingDueCount]
      properties:
        reviewItemId: { type: string, format: uuid }
        memory: { $ref: '#/components/schemas/MemorySnapshot' }
        competence: { $ref: '#/components/schemas/CompetenceSignals' }
        remainingDueCount: { type: integer, minimum: 0 }
        feedback: { type: string, maxLength: 500 }
    ReviewQueueResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ReviewQueueItem' }
        meta: { $ref: '#/components/schemas/CursorResponseMeta' }
    ReviewAnswerResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ReviewAnswerResult' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    Attribution:
      type: object
      additionalProperties: false
      description: Product-facing source and license fields, included only when attribution is required.
      required: [sourceName, licenseCode, attributionText]
      properties:
        sourceName: { type: string, minLength: 1, maxLength: 200 }
        licenseCode: { type: string, minLength: 1, maxLength: 64 }
        attributionText: { type: string, minLength: 1, maxLength: 1000 }
        sourceUrl: { type: string, format: uri }
    ConceptDefinition:
      type: object
      additionalProperties: false
      required: [definition, languageCode, order]
      properties:
        definition: { type: string, minLength: 1, maxLength: 4000 }
        translation: { type: string, maxLength: 4000 }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        order: { type: integer, minimum: 0 }
    ConceptExample:
      type: object
      additionalProperties: false
      required: [sentenceId, text]
      properties:
        sentenceId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 5000 }
        translation: { type: string, maxLength: 5000 }
        audioUrl: { type: string, format: uri }
    ConceptRelation:
      type: object
      additionalProperties: false
      required: [conceptId, relationType, canonicalForm]
      properties:
        conceptId: { type: string, format: uuid }
        relationType: { type: string, minLength: 1, maxLength: 64 }
        canonicalForm: { type: string, minLength: 1, maxLength: 300 }
    GrammarStructuralSlot:
      type: object
      additionalProperties: false
      required: [label, role, required, examples]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        role: { type: string, minLength: 1, maxLength: 100 }
        required: { type: boolean }
        examples:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1 }
    GrammarSpecification:
      type: object
      additionalProperties: false
      required:
        - patternFormula
        - syntacticCategory
        - pragmaticFunction
        - vietnameseExplanation
        - structuralSlots
      properties:
        patternFormula: { type: string, minLength: 1, maxLength: 1000 }
        syntacticCategory: { type: string, minLength: 1, maxLength: 100 }
        pragmaticFunction: { type: string, minLength: 1, maxLength: 2000 }
        vietnameseExplanation: { type: string, minLength: 1, maxLength: 4000 }
        vietnameseCommonTraps: { type: string, minLength: 1, maxLength: 4000 }
        structuralSlots:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/GrammarStructuralSlot' }
    ConceptDetail:
      type: object
      additionalProperties: false
      required: [id, languageCode, canonicalForm, definitions, examples, relations, learner]
      properties:
        id: { type: string, format: uuid }
        languageCode: { $ref: '#/components/schemas/LanguageCode' }
        canonicalForm: { type: string, minLength: 1, maxLength: 300 }
        partOfSpeech:
          oneOf:
            - $ref: '#/components/schemas/PartOfSpeech'
            - type: 'null'
        ipa: { type: string, maxLength: 200 }
        audioUrl: { type: string, format: uri }
        level:
          oneOf:
            - $ref: '#/components/schemas/ProficiencyLevel'
            - type: 'null'
        definitions:
          type: array
          items: { $ref: '#/components/schemas/ConceptDefinition' }
        examples:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ConceptExample' }
        relations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ConceptRelation' }
        grammar: { $ref: '#/components/schemas/GrammarSpecification' }
        learner: { $ref: '#/components/schemas/ConceptLearnerProjection' }
        attribution: { $ref: '#/components/schemas/Attribution' }
    ConceptLearnerProjection:
      type: object
      additionalProperties: false
      required: [status, isDue, exposureCount, competence]
      properties:
        status: { $ref: '#/components/schemas/ConceptStatus' }
        isDue: { type: boolean }
        exposureCount: { type: integer, minimum: 0 }
        lastSeenAt: { type: string, format: date-time }
        memory: { $ref: '#/components/schemas/MemorySnapshot' }
        competence: { $ref: '#/components/schemas/CompetenceSignals' }
    ConceptResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ConceptDetail' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    DictionarySearchResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ConceptSummary' }
        meta: { $ref: '#/components/schemas/CursorResponseMeta' }
        lemmaGroups:
          type: array
          description: >-
            Complete approved lemma groups associated with the concepts on this page. Groups do
            not alter flat result ordering or cursor advancement and may repeat, complete, on
            later pages.
          items: { $ref: '#/components/schemas/DictionaryLemmaGroup' }
    ReaderAnalyzeRequest:
      type: object
      additionalProperties: false
      required: [text, targetLanguageCode, translationLanguageCode]
      properties:
        title: { type: string, maxLength: 300 }
        text: { type: string, minLength: 1, maxLength: 20000 }
        targetLanguageCode: { $ref: '#/components/schemas/LanguageCode' }
        translationLanguageCode: { $ref: '#/components/schemas/LanguageCode' }
    SentenceConceptAnnotation:
      type: object
      additionalProperties: false
      required: [conceptId, canonicalForm, startOffset, endOffset, status]
      properties:
        conceptId: { type: string, format: uuid }
        canonicalForm: { type: string, minLength: 1, maxLength: 300 }
        startOffset:
          type: integer
          minimum: 0
          description: Zero-based UTF-16 code-unit index of the inclusive span start.
        endOffset:
          type: integer
          minimum: 1
          description: Zero-based UTF-16 code-unit index of the exclusive span end; must be greater than startOffset.
        status: { $ref: '#/components/schemas/ConceptStatus' }
    ReaderSentence:
      type: object
      additionalProperties: false
      required: [id, text, order, concepts]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 5000 }
        translation: { type: string, maxLength: 5000 }
        audioUrl: { type: string, format: uri }
        order: { type: integer, minimum: 0 }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/SentenceConceptAnnotation' }
    ReaderSegment:
      type: object
      additionalProperties: false
      required: [id, order, text, sentences]
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 0 }
        text: { type: string, minLength: 1, maxLength: 20000 }
        sentences:
          type: array
