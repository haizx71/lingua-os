openapi: 3.2.0
info:
  title: LINGUA OS API
  version: 1.0.0
  summary: Executable MVP product contract for English learning by Vietnamese learners.
  description: |
    LINGUA OS exposes product-oriented DTOs for the MVP learning loop. Browser clients obtain a
    Supabase Auth JWT and send it to FastAPI. FastAPI validates the authenticated actor and is the
    only product-data gateway to PostgreSQL/Supabase; browser clients never read or write product
    tables directly. Server-side ownership checks are mandatory even where PostgreSQL RLS provides
    defence in depth. The JWT subject maps to the same UUID identity boundary used by
    `auth.users.id` and `public.users.id`, but storage rows and ownership keys are not public DTOs.

    All IDs are UUIDs. All timestamps are RFC 3339 UTC instants. State-changing retries use either
    an `Idempotency-Key` or an intrinsically idempotent PUT/DELETE. Profile edits use ETag and
    `If-Match`. The public contract exposes one memory snapshot per learner/concept; recognition,
    listening, and production competence remain separate projections, never independent schedules.

    `GET /v1/me` is the only application-identity bootstrap operation. No operation other than
    GET /v1/me creates `public.users` or `learner_profiles`; an authenticated actor without that
    application identity receives 404 NOT_FOUND from downstream product operations and must call
    `/v1/me`. Bootstrap never creates a Language Profile or learning state.

    When running on Render with a valid platform-provided `RENDER_GIT_COMMIT`, API responses may
    include the optional `X-Lingua-Source-Sha` response header containing that lowercase 40-hex
    source commit. It is emitted only by the Render service named `lingua-api-staging`. Clients
    must not use this operational attestation for authorization; the hosted acceptance harness
    requires it to match the tested deployment SHA on every API response.

  license:
    name: LINGUA OS private API contract
    identifier: LicenseRef-LINGUA-OS-Private
servers:
  - url: /api
    description: Same-origin FastAPI gateway
security:
  - supabaseBearer: []
tags:
  - name: Profile
    description: Authenticated learner identity, bootstrap, and persisted language preferences.
  - name: Today
    description: Backend-owned daily plan and activity completion.
  - name: Review
    description: One primary memory queue and retry-safe review evidence.
  - name: Concepts
    description: Dictionary search and lexical concept detail.
  - name: Reader
    description: Reader analysis and sentence-mining product actions.
  - name: Content
    description: Published, provenance-gated learner content.
  - name: Library
    description: Authenticated learner saved content, sentences, and concepts.
  - name: Assessment
    description: Evidence-based Starting Level Estimate sessions.
  - name: Brain
    description: Relational Language Brain summary, list, and concept projections.
  - name: Progress
    description: Bounded evidence-based learning progress summaries.
  - name: Admin
    description: Owner-only first-party content authoring; access is controlled by server-side actor UUID allowlist.
paths:
  /v1/admin/concepts/search:
    get:
      tags: [Admin]
      operationId: searchAdminConcepts
      summary: Search accepted English catalog concepts for owner authoring
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Bounded owner-only catalog matches; no learner profile is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConceptSearchResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/content:
    get:
      tags: [Admin]
      operationId: listAdminContent
      summary: List bounded owner-authored content records
      responses:
        '200':
          description: Owner-only authoring catalog ordered by latest update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin]
      operationId: createAdminContent
      summary: Create one original English micro-article
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminContentRequest' }
      responses:
        '201':
          description: First-party content and deterministic normalized structure created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/content/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Admin]
      operationId: getAdminContent
      summary: Inspect one owner-authored content record
      responses:
        '200':
          description: Authoring detail and deterministic sentence preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Admin]
      operationId: updateAdminContent
      summary: Update an unpublished owner-authored content record
      description: Published and retired records cannot be edited; corrections require a new content identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminContentRequest' }
      responses:
        '200':
          description: Updated authoring detail with rebuilt deterministic sentence structure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/content/{contentId}/validate:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [Admin]
      operationId: validateAdminContent
      summary: Validate first-party provenance and Reader publication dependencies
      responses:
        '200':
          description: Current validation result; valid content advances to reviewed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentValidationResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/content/{contentId}/translations/vi:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    put:
      tags: [Admin]
      operationId: putAdminVietnameseTranslations
      summary: Replace or explicitly clear the complete owner-authored Vietnamese sentence set
      description: |
        The server locks the content and aligns the one-based ordinals and exact English source
        text to its current deterministic sentence order. A non-empty set must cover every sentence.
        The empty entries array is the only clear operation. Foreign Vietnamese provenance causes
        a conflict before any translation row is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutAdminVietnameseTranslationsRequest' }
      responses:
        '200':
          description: Current ordered English and Vietnamese authoring preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/content/{contentId}/sentences/{sentenceId}/concepts/{conceptId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
      - $ref: '#/components/parameters/SentenceId'
      - $ref: '#/components/parameters/ConceptId'
    put:
      tags: [Admin]
      operationId: putAdminSentenceConcept
      summary: Add or update one exact catalog-concept occurrence in an unpublished sentence
      description: The UTF-16 half-open span is explicit and the same request is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutAdminSentenceConceptRequest' }
      responses:
        '200':
          description: Updated content detail and recomputed publication readiness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin]
      operationId: deleteAdminSentenceConcept
      summary: Remove one exact catalog-concept occurrence from an unpublished sentence
      parameters:
        - name: startOffset
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: endOffset
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated content detail; deleting an absent exact occurrence is idempotent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/content/{contentId}/publish:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [Admin]
      operationId: publishAdminContent
      summary: Publish reviewed first-party content through the authoritative database gate
      responses:
        '200':
          description: Published content; its Reader structure is now immutable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/content/{contentId}/retire:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [Admin]
      operationId: retireAdminContent
      summary: Retire published first-party content from learner discovery
      responses:
        '200':
          description: Retired content remains auditable but is no longer learner-visible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get the authenticated learner bootstrap profile
      description: |
        This is the only bootstrap-capable operation. For a verified JWT whose application identity
        does not yet exist, FastAPI atomically creates only `public.users` and `learner_profiles` in
        one transaction and returns the owned profile. PostgreSQL uniqueness makes concurrent first
        requests converge on one identity. Bootstrap is actor-bound and idempotent and does not
        create a Language Profile, Starting Level state, evidence, Review state, Today plans,
        Library state, or Reader progress. Existing identities are read without bootstrap mutation.
      responses:
        '200':
          description: Profile bootstrap. ETag identifies this editable representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update persisted learner profile settings
      description: |
        Updates only server-persisted profile fields. Theme and reduced-motion remain client
        preferences. A missing, malformed, weak, wildcard, multiple, or stale If-Match fails with
        412 PRECONDITION_FAILED. Missing application identity returns 404.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated profile.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/me/languages:
    get:
      tags: [Profile]
      operationId: listMyLanguageProfiles
      summary: List the authenticated learner's bounded language profiles
      description: |
        Returns only profiles owned by the bootstrapped actor, ordered by creation time and ID.
        This read never bootstraps application identity or creates a Language Profile. Missing
        application identity returns 404 NOT_FOUND.
      responses:
        '200':
          description: Language profiles. The MVP activates English learning with Vietnamese support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageProfilesResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Profile]
      operationId: createMyLanguageProfile
      summary: Create an owned learning-language profile
      description: |
        Requires an existing application identity and valid IANA timezone. MVP creation accepts
        exactly native `vi` to target `en`, an approved LearningGoal, and dailyMinutes 5..180.
        Starting Level is optional and not required for learning readiness. The Idempotency-Key is
        scoped to the actor and canonical logical request. Same key and request performs an exact
        replay of status 201, the original data snapshot, and original ETag with fresh response
        metadata; key reuse with a different request returns IDEMPOTENCY_KEY_REUSED. A different key
        for the actor's lifetime English profile returns CONFLICT, including after archive.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLanguageProfileRequest'
      responses:
        '201':
          description: Created language profile.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageProfileResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/me/languages/{languageProfileId}:
    parameters:
      - $ref: '#/components/parameters/LanguageProfileId'
    patch:
      tags: [Profile]
      operationId: updateMyLanguageProfile
      summary: Update owned learning goals and persisted settings
      description: |
        Updates one existing owned Language Profile. Missing and not owned IDs return the same 404
        before ETag comparison. A missing, malformed, weak, wildcard, multiple, or stale If-Match
        fails with 412 PRECONDITION_FAILED. Archive preserves all learning history; reactivation
        updates the same lifetime row instead of creating another target-language profile.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLanguageProfileRequest'
      responses:
        '200':
          description: Updated language profile.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageProfileResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/today:
    get:
      tags: [Today]
      operationId: getTodayPlan
      summary: Get the backend-owned plan for a local learner day
      description: |
        Returns selected activities and human-readable reasons, never recommendation formulas or
        score internals. Missing application identity or active Language Profile returns 404. An
        owned learner profile without a valid IANA timezone returns 409 INVALID_STATE_TRANSITION
        with no plan write; Today has no UTC, server-timezone, geographic, or raw-offset fallback.
      parameters:
        - $ref: '#/components/parameters/LanguageProfileIdQuery'
        - name: date
          in: query
          description: Learner-local date. Defaults to today in the learner profile time zone.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Existing or generated Today plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayPlanResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/today/{planId}/activities/{activityId}/complete:
    parameters:
      - $ref: '#/components/parameters/PlanId'
      - $ref: '#/components/parameters/ActivityId'
    post:
      tags: [Today]
      operationId: completeTodayActivity
      summary: Complete one owned Today activity exactly once
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTodayActivityRequest'
      responses:
        '200':
          description: Updated plan and completed activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayCompletionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/review/queue:
    get:
      tags: [Review]
      operationId: listReviewQueue
      summary: List one cursor-paginated due queue for the learner
      description: Each concept has one primary memory item. Exercise modes are presentation variants, not separate schedules.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LanguageProfileIdQuery'
      responses:
        '200':
          description: Review items ordered by the future Memory Engine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueueResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/review/{reviewItemId}/answer:
    parameters:
      - $ref: '#/components/parameters/ReviewItemId'
    post:
      tags: [Review]
      operationId: answerReviewItem
      summary: Record evidence and rate one primary memory item
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewAnswerRequest'
      responses:
        '200':
          description: Updated single memory snapshot and separate competence projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewAnswerResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/concepts/{conceptId}:
    parameters:
      - $ref: '#/components/parameters/ConceptId'
    get:
      tags: [Concepts]
      operationId: getConcept
      summary: Get lexical detail and the authenticated learner projection
      responses:
        '200':
          description: Concept detail with optional attribution when the source or license requires it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dictionary/search:
    get:
      tags: [Concepts]
      operationId: searchDictionary
      summary: Search published lexical concepts
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: languageCode
          in: query
          schema:
            $ref: '#/components/schemas/LanguageCode'
        - name: includeLemmaGroups
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching concept summaries.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionarySearchResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/reader/analyze:
    post:
      tags: [Reader]
      operationId: analyzeReaderText
      summary: Analyze bounded learner-provided English text
      description: Returns concept annotations without exposing provider or analysis algorithm internals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderAnalyzeRequest'
      responses:
        '200':
          description: Transient Reader analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderAnalyzeResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/reader/exposures:
    post:
      tags: [Reader]
      operationId: recordReaderExposure
      summary: Record one deliberate passive Reader interaction
      description: |
        Records one eligible logical Reader interaction; opening content, a rerender, or merely
        entering the viewport is not exposure. A read interaction completes when the segment's
        beginning has entered the visible document and its end is later crossed in the same visible
        reading interaction. A listen interaction completes at natural media end or after at least
        90 percent playback with at least 80 percent of the media range traversed; seeking directly
        to the end is ineligible. A lookup interaction begins when the learner deliberately opens
        dictionary detail for the exact catalog sentence span and ends when that inspector closes
        or changes context.

        The server validates the owned language profile, published English content hierarchy and
        exact authoritative occurrences. Read/listen fan out to one passive canonical event per
        distinct concept linked to the segment; lookup resolves exactly one concept. The client
        never supplies concept IDs or learning projections. Repeated UI mechanics within the same
        logical interaction reuse the same Idempotency-Key and do not count again. Refresh,
        reconnect and timeout retries reuse that key; a deliberate later interaction uses a new
        key.

        The idempotency fingerprint contains the same actor, owned language profile, content,
        segment, exposure type, optional sentence and offsets, and normalized occurredAt. The same
        actor/key/fingerprint replays the exact stored response. The same key with a different
        fingerprint returns 409 IDEMPOTENCY_KEY_REUSED. An in-flight duplicate returns 409 CONFLICT
        and may be retried with the same key. No competence, mastery, confidence, FSRS state or
        internal learning-event identity is returned.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderExposureRequest'
      responses:
        '200':
          description: Exact accepted passive interaction result, including on completed replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderExposureResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/reader/progress/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    put:
      tags: [Reader]
      operationId: updateReaderProgress
      summary: Update the owned segment-level Reader resume projection
      description: |
        Persists the currently opened segment separately from passive exposure. The first accepted
        mutation sets startedAt and each new logical mutation sets lastOpenedAt. The server tracks a
        monotonic furthest segment and derives progressPercent from its stable order; the furthest
        segment never regresses when another device or an older segment is submitted. A backwards segment is a
        valid reopening position and updates currentSegmentId only. An unknown segment or a segment
        outside this published content item fails validation.

        isCompleted=true is valid only when currentSegmentId is the final segment. First completion
        fixes completedAt. Reopening completed content, including at an earlier segment, changes the
        current position but preserves furthestSegmentId, isCompleted=true and completedAt. Progress
        never emits exposure, competence, mastery or FSRS evidence.

        The fingerprint contains the same actor, owned language profile, path contentId,
        currentSegmentId and isCompleted. Same actor/key/fingerprint replays the exact stored result;
        changed payload returns 409 IDEMPOTENCY_KEY_REUSED. An in-flight duplicate returns 409
        CONFLICT and may be retried with the same key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReaderProgressRequest'
      responses:
        '200':
          description: Exact current Reader progress projection, including on completed replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingProgressResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/reader/save-sentence:
    post:
      tags: [Reader, Library]
      operationId: saveReaderSentence
      summary: Save one authoritative published catalog sentence
      description: |
        Saves only a persisted catalog sentence linked to published content in the actor's active
        MVP language. Transient /reader/analyze sentence IDs, missing sentences, unpublished content
        and content outside the actor's language boundary are not valid targets. The server resolves
        catalog concept annotations; this mutation neither accepts concept IDs nor implicitly saves
        concepts. Already saved is a successful idempotent result. Same actor/key/payload replays the
        exact result; changed payload returns 409 IDEMPOTENCY_KEY_REUSED.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSentenceRequest'
      responses:
        '200':
          description: Saved sentence library item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryMutationResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/content/recommended:
    get:
      tags: [Content]
      operationId: listRecommendedContent
      summary: List cursor-paginated content recommendations
      description: |
        Only published English content passing the complete dependency gate is learner-visible:
        approved source records, allowed licenses, complete required attribution, normalization,
        valid ordered segments and offsets, authoritative concept annotations, a curated A0-B1
        level, current QA metrics and reviewed state. Restricted/unknown/prohibited licenses or
        incomplete dependency provenance are excluded.
      parameters:
        - $ref: '#/components/parameters/LanguageProfileIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published content summaries with product-level fit reasons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRecommendationsResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/content/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Content, Reader]
      operationId: getContent
      summary: Get one published content item for Reader
      description: |
        Rejects unpublished content and enforces the complete dependency publication gate before
        learner delivery. Every visible content, segment, sentence, translation, annotation,
        lexical and audio dependency must have approved provenance, an allowed license and complete
        required attribution. English language, normalization, segment integrity, offsets,
        authoritative concept links, curated A0-B1 level, QA metrics and reviewed state are
        required. Restricted/unknown/prohibited licenses are never learner-visible.
      responses:
        '200':
          description: Reader-ready content. Attribution is present only when required by source or license.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/library/items:
    get:
      tags: [Library]
      operationId: listLibraryItems
      summary: List saved content, sentences, or concepts
      parameters:
